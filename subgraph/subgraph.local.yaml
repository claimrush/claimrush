        - event: LockingPausedChanged(bool)
          handler: handleLockingPausedChanged
        - event: DelegationSessionUsed(indexed address,indexed address,indexed uint8,uint256,uint256,uint256)
          handler: handleDelegationSessionUsed
        - event: AutoMaxBonusClaimed(indexed address,uint256,uint256)
          handler: handleAutoMaxBonusClaimed
      blockHandlers:
        - handler: handleFurnaceBlock
      file: ./src/mappings/furnace.ts

