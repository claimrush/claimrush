# Internal event-order helpers. BonusPaid carries the raw AMM split; the
# subsequent receipt event carries the actual user-delivered bonus after
# sub-MIN_TOPUP dust is refunded to reserve. A single tx can emit multiple
# bonus events for the same user, so matching is FIFO by (txHash,user).
type PendingBonusPaidQueue @entity(immutable: false) {
  id: ID! # "{txHash}-{user}"
  head: Int!
  tail: Int!
}

type PendingBonusPaid @entity(immutable: false) {
  id: ID! # "{txHash}-{user}-{sequence}"
  queueId: String!
  sequence: Int!
  txHash: Bytes!
  user: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  userBonusClaim: BigInt!
  reserveAfter: BigInt!
}

# Internal join helper: one row per FurnaceEnter log in a tx that also contains
# an auto-furnace execution receipt. Keyed by log identity so a batched helper
# transaction with multiple FurnaceEnter logs cannot have a later sibling
# overwrite an earlier row's token id. The MarketRouter execution-side
# resolver looks up the join by the FurnaceEnter logIndex immediately
# preceding the executing event in the same receipt.
type TxFurnaceEnter @entity(immutable: false) {
  id: ID! # "{txHash}-{logIndex}"
  txHash: Bytes!
  user: User!
  logIndex: BigInt!
  tokenId: BigInt!
  principalClaimWei: BigInt!
  bonusClaimWei: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
}


type FurnaceBonusSnapshot @entity(immutable: false) {
  id: ID! # always "1"
  updatedAt: BigInt!
  lastDayId: Int!          # day index (unix_seconds / 86400) of last 24h window reset

  # Internal performance helper: 5m bucketStart timestamp (seconds) when the 24h window was last fully recomputed.
  last24hRecomputeBucketStart: BigInt

  currentBps: Int!
  min24hBps: Int!
  max24hBps: Int!
  min7dBps: Int!
  max7dBps: Int!
  min30dBps: Int!
  max30dBps: Int!
  q33Bps: Int!
  q66Bps: Int!
  q95Bps: Int
}

