name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

# Coalesce overlapping runs for the same PR / issue-comment stream so a rapid
# synchronize + "recheck" sequence does not race on the signatures file or
# produce duplicate PR comments. `cancel-in-progress: true` is safe: the
# latest run always sees the latest head SHA, and the CLA action is idempotent
# against the signatures branch.
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cla:
    runs-on: ubuntu-latest
    # Bounded wall clock so a stuck run from a hung action step cannot sit in
    # the queue indefinitely. The contributor-assistant action normally
    # completes in well under a minute; 10 minutes is a generous headroom.
    timeout-minutes: 10
    if: >-
      (github.event_name == 'pull_request_target')
      || (github.event_name == 'issue_comment'
          && github.event.comment.body == 'recheck')
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: main
          allowlist: dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            CLA signature required before merge. Sign the
            [ClaimRush CLA](https://github.com/${{ github.repository }}/blob/main/CLA.md).

            Reply with the following to confirm:

            > I have read the CLA Document and I hereby sign the CLA
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
