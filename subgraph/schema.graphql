  id: ID! # txHash-logIndex
  to: User!
  amountWei: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

# Aerodrome trading fees claimed-and-forwarded by GenesisLPVault24M.withdrawLp().
# Emitted in the same transaction as (and immediately before) the corresponding
# GenesisWithdrawLpEvent / GenesisResidualLpSweepEvent. Forwarded amounts are
# token0 + token1 of the genesis pool (WETH/CLAIM ordering is pool-defined).
# At least one of `amount0Wei` / `amount1Wei` is strictly > 0; the contract does
# not emit this event for a zero-fee withdrawal.
type GenesisLpFeeClaimEvent @entity(immutable: true) {
  id: ID! # txHash-logIndex
  # Canonical recipient = `vault.lpWithdrawRecipient()` (resolved via contract
  # call from the mapping handler). For Safe-multisig / batched / sponsored
  # withdrawals this is the Safe address itself, NOT `event.transaction.from`
  # (which would be the EOA submitter). If the contract read ever reverts (RPC
  # blip, non-conforming vault, ABI drift) the handler routes attribution to the
  # deterministic burn-style sentinel `0x000000000000000000000000000000000000dEaD`
  # rather than `tx.from`, to avoid silently misattributing fee claims to a
  # relayer / Safe-submitter EOA. Consumers MUST filter on
  # `recipientResolvedByFallback == true` to detect / ignore those rows.
  # The canonical recipient is also independently observable on the always-paired
  # `GenesisWithdrawLpEvent` / `GenesisResidualLpSweepEvent` (`to` field) fired
  # in the same transaction immediately after this event.
  to: User!
  # True when the handler routed `to` to the FALLBACK_RECIPIENT_SENTINEL because
  # the on-chain `vault.lpWithdrawRecipient()` read reverted. Always false on
  # healthy mainnet operation; an alert should fire on any true row.
  recipientResolvedByFallback: Boolean!
  token0: Bytes!
  token1: Bytes!
  amount0Wei: BigInt!
  amount1Wei: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

