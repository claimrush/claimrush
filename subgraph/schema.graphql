# MarketRouter global offer params (anti-spam / safety)

# Stores the latest known values of MarketRouter bonus-target escrow spam controls.
# - minBudget is in CLAIM wei.
# - maxDiscountBps is the extra discount cap (bps).
#
# maxBonusTargetEscrowDiscountBps is never negative onchain; -1 is used as a sentinel
# for "unknown" when indexing starts mid-history and no snapshot is available.
type MarketRouterParams @entity(immutable: false) {
  id: ID! # always "current"
  updatedAt: BigInt!
  minBonusTargetEscrowBudgetClaimWei: BigInt!
  maxBonusTargetEscrowDiscountBps: Int!
}

# Immutable history for MarketRouter.setBonusTargetEscrowParams(...) (pre-freeze).
type BonusTargetEscrowParamsChangedEvent @entity(immutable: true) {
  id: ID! # txHash-logIndex
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!

  oldMinBudgetClaimWei: BigInt!
  newMinBudgetClaimWei: BigInt!
  oldMaxDiscountBps: Int!
  newMaxDiscountBps: Int!
}


type MarketTradeEvent @entity(immutable: true) {
  id: ID! # txHash-logIndex
  kind: String! # "BUY" (strict mode: derived from Furnace.LockSoldToFurnace)
  tokenId: BigInt!
  seller: User!
  buyer: User!
  # Reserved for compatibility trade joins; null in the strict-mode subgraph.
  offer: BonusTargetEscrow
  priceInClaimWei: BigInt!
  # Fee sent to Furnace reserve (duration-based: 25% at 365d, ~0.5% at 7d).
  feeToFurnaceWei: BigInt
  lockAmountWei: BigInt
  discountBps: Int
  timestamp: BigInt!
  txHash: Bytes!
}

type BonusTargetEscrow @entity(immutable: false) {
  id: ID! # offerId as string
  offerId: BigInt!
  buyer: User!
  discountBps: Int!

  # Normalized bid price, expressed in bps (scaled by 10_000).
  #
  # - For compatibility discount offers: priceBps = (10_000 - discountBps)
  # - For bonus-target offers:    priceBps = 10_000 - floor(targetBonusBps * 10_000 / (10_000 + targetBonusBps))
  #   NOTE: This can differ from floor(10_000^2 / (10_000 + targetBonusBps)) by up to 1 bps due to integer rounding.
  #
  # This is intended for server-side ordering in an orderbook view.
  priceBps: BigInt!

  # Compatibility field: per-offer minimum lock size. Null for AutoFill v2 offers.
  minLockSizeWei: BigInt

  budgetClaimWei: BigInt!
  fundsRemainingWei: BigInt
  createdAt: BigInt!
  updatedAt: BigInt!
  active: Boolean!

  # AutoFill v2 settings
  durationSeconds: BigInt
  createAutoMax: Boolean!
  expiresAt: BigInt!
  destinationLockId: BigInt
  destinationLock: VeLock

  targetBonusBps: Int!
  # Auto-furnace slippage protection in bps (0 if unknown / not configured).
  slippageBps: Int!
}

# Offer status / history surface. Canonical execution history uses kind =
# "FILLED" from the generic BonusTargetEscrowExecuted receipt.
# AUTO_FURNACE_EXECUTED is retained as the same-tx companion for detail and compatibility consumers.
type BonusTargetEscrowEvent @entity(immutable: true) {
  id: ID! # txHash-logIndex
  offer: BonusTargetEscrow!
  kind: String! # "CREATED" | "CANCELLED" | "EXPIRED" | "EXPIRY_EXTENDED" | "FILLED" | "BONUS_CONFIGURED" | "AUTO_FURNACE_EXECUTED"
  timestamp: BigInt!
  txHash: Bytes!
}

# Canonical generic execution receipt from MarketRouter.BonusTargetEscrowExecuted.
type BonusTargetEscrowExecutedEvent @entity(immutable: true) {
  id: ID! # txHash-logIndex
  offer: BonusTargetEscrow!
  buyer: User!

  claimInWei: BigInt!
  principalClaimWei: BigInt!
  bonusClaimWei: BigInt!
  veOutWei: BigInt!
  # Explicit ratio used by MarketRouter's BonusTarget gate: bonusClaim/principalClaim.
  bonusBpsVsPrincipalClaim: Int!

  routeTokenId: BigInt!
  furnaceTokenId: BigInt

  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

# Backward-compatible auto-furnace execution receipt retained for existing consumers.
type BonusTargetEscrowAutoFurnaceExecutedEvent @entity(immutable: true) {
  id: ID! # txHash-logIndex
  offer: BonusTargetEscrow!
  buyer: User!

  claimInWei: BigInt!
  principalClaimWei: BigInt!
  bonusClaimWei: BigInt!
  veOutWei: BigInt!
  # Explicit ratio used by MarketRouter's BonusTarget gate: bonusClaim/principalClaim.
  bonusBpsVsPrincipalClaim: Int!

  # Route token id from the Furnace quote (0 means a new lock was created).
  routeTokenId: BigInt!
  # Actual token id used by FurnaceEnter (minted id when routeTokenId == 0).
  furnaceTokenId: BigInt

  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}


