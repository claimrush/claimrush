type FurnaceEnterEvent @entity(immutable: true) {
  id: ID! # txHash-logIndex
  # Zero-padded blockNumber + ':' + id. See DelegationSessionUse.sortKey.
  # Leaderboard ingest (`workers/chat/src/lib/leaderboards/sync/fetchers/furnaceEnter.ts`)
  # MUST page by `orderBy: sortKey, sortKey_gt: $afterSortKey`.
  sortKey: String!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!

  # Public 24h / 7d Furnace window stats that scan these rows MUST capture `_meta` first,
  # pin reads to one block, and paginate with a stable cursor. `skip` pagination on a moving
  # head is not sufficient for shipped metrics.

  user: User!
  mode: Int! # 0 ETH, 1 CLAIM, 2 LOCK_FURNACE, 3 TOKEN, 4 EXTEND_WITH_BONUS
  ethInWei: BigInt!
  principalClaimWei: BigInt!
  bonusClaimWei: BigInt!
  tokenId: BigInt!

  # mode=3 (TOKEN): populated by calldata + ERC20 Transfer decoding
  tokenIn: Bytes
  amountInWei: BigInt
}

