# Current-state mirror of ShareholderRoyalties.getAutoCompoundConfig(user).
# id == user address (lowercase). Last-write-wins per user.
#
# Used by the activity feed (frontend) to label a FurnaceEnter row as
# "Eternal Lock" using the SAME predicate as the lock page
# (`frontend/src/lib/useEternalLockPrefs.ts`):
#   enabled && !paused && tokenId == row.tokenId && VeLock.autoMax === true
type ShareholderAutoCompoundConfig @entity(immutable: false) {
  id: ID! # user address lowercase
  user: User!
  enabled: Boolean!
  paused: Boolean!
  tokenId: BigInt!
  durationSeconds: BigInt!
  minCadenceSeconds: BigInt!
  minEthToCompoundWei: BigInt!
  maxSlippageBps: BigInt!
