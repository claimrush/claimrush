name: Slither static analysis

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: slither-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slither:
    name: slither
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@8b0419c685ef46cb79ec93fbdc131174afceb730 # v1.6.0
        with:
          version: v1.5.1

      - name: Install Foundry dependencies
        run: make deps

      - name: Install Slither
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "slither-analyzer==0.11.5"

      - name: Build contracts (Slither needs artifacts)
        run: bash scripts/slither_foundry_build.sh

      - name: Run Slither
        run: |
          mkdir -p slither-reports
          slither . \
            --config-file slither.config.json \
            --foundry-ignore-compile \
            --sarif slither-reports/results.sarif \
            --json slither-reports/results.json \
            --checklist

      - name: Upload Slither SARIF to GitHub Security
        if: always() && hashFiles('slither-reports/results.sarif') != ''
        # GitHub Code Scanning (the SARIF dashboard at /security/code-scanning)
        # is only enabled by default on PUBLIC repos and on private repos with
        # GitHub Advanced Security. While claimrush/claimrush is held private
        # (see public-repo rehearsal seed plan), the upload step fails with
        # "Resource not accessible by integration". The actual slither scan
        # earlier in the job is the gate; the upload is publication-only.
        # When the repo flips to public on May 29 the upload will succeed
        # and start populating the Code Scanning dashboard automatically.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          sarif_file: slither-reports/results.sarif
          category: slither

      - name: Upload Slither report
        if: always()
        # See .github/workflows/slither.yml for rationale — tolerate org-level
        # Actions storage-quota exhaustion so a quota-saturated org doesn't
        # red-X every push. SARIF upload below is a separate API.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slither-report
          path: slither-reports/
          retention-days: 30
