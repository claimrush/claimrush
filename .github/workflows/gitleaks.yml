name: Secrets scanning

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Install the open-source gitleaks BINARY directly rather than
      # using gitleaks/gitleaks-action. Background: as of v2.0+ the
      # gitleaks-action wrapper requires a paid commercial license
      # (GITLEAKS_LICENSE) for org-owned repos; without one it exits with
      # "missing gitleaks license". The underlying gitleaks binary
      # (https://github.com/gitleaks/gitleaks) remains MIT-licensed
      # and free, so we use it directly. Mirrors the private repo's
      # gitleaks.yml (migrated to direct-binary install on 2026-05-14).
      # SHA pin: gitleaks v8.30.1 release published 2026-04-09.
      - name: Install gitleaks binary (open-source MIT)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # SHA256 of gitleaks_8.30.1_linux_x64.tar.gz from the
          # 2026-04-09 release. Verified locally on 2026-05-14:
          #   curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sha256sum
          # When bumping GITLEAKS_VERSION update this hash too.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"  # pragma: allowlist secret
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version

      - name: Scan for secrets
        run: |
          # --redact prints findings without the matched secret value
          # (still non-zero exit). --no-banner keeps logs tight.
          # Without --config, gitleaks uses its bundled default ruleset.
          /tmp/gitleaks detect --source . --redact --no-banner --verbose

  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "detect-secrets==1.5.0"

      - name: Verify baseline is up to date
        run: |
          detect-secrets scan \
            --exclude-files 'node_modules/.*' \
            --exclude-files 'lib/.*' \
            --exclude-files 'out/.*' \
            --exclude-files 'dist/.*' \
            --exclude-files '\.next/.*' \
            --exclude-files 'package-lock\.json' \
            --exclude-files '\.gas-snapshot' \
            --baseline .secrets.baseline
          # `detect-secrets audit` takes the baseline as a positional arg, not
          # `--baseline`. The previous form failed with "unrecognized arguments".
          detect-secrets audit --report .secrets.baseline
