name: Analytics SQL lint

concurrency:
  group: analytics-sql-lint-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'analytics/**'
      - 'docs/analytics/**'
      - 'abis/**'
      - 'scripts/check_abi_events_vs_dune.py'
      - 'scripts/check_abis_vs_dune_pack.py'
      - 'Makefile'
      - '.github/workflows/analytics-sql-lint.yml'
  pull_request:
    paths:
      - 'analytics/**'
      - 'docs/analytics/**'
      - 'abis/**'
      - 'scripts/check_abi_events_vs_dune.py'
      - 'scripts/check_abis_vs_dune_pack.py'
      - 'Makefile'
      - '.github/workflows/analytics-sql-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Analytics SQL lint
        run: make analytics-lint
