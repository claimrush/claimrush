      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - User
        - DelegationSession
        - DelegationSessionSetEvent
      abis:
        - name: DelegationHub
          file: ../abis/base_sepolia/DelegationHub.abi.json
      eventHandlers:
        - event: SessionSet(indexed address,indexed address,uint256,uint256)
          handler: handleSessionSet
      file: ./src/mappings/delegationHub.ts

