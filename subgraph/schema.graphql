type VeLock @entity(immutable: false) {
  id: ID! # tokenId as string
  tokenId: BigInt!
  owner: User!

  amountWei: BigInt!
  lockEnd: BigInt!
  autoMax: Boolean!
  # If the subgraph starts indexing mid-history, listed may be false for locks that
  # are actually listed on-chain. The hydrateVeLockIfNeeded() function in marketRouter.ts
  # handles amountWei/lockEnd but does NOT hydrate the listed flag.
  # IMPACT: UI may show stale "not listed" for locks that were listed before indexing started.
  listed: Boolean!

  createdAt: BigInt!
  updatedAt: BigInt!

  currentVeWei: BigInt # Event-driven snapshot at the lock's last activity; live consumers MUST recompute from amountWei + lockEnd (+ autoMax) using the full owner-lock snapshot
}

