# ClaimRush v1.0.0 subgraph schema
#
# Graph CLI ≥0.98 requires an explicit `immutable` flag on every `@entity` (mutable aggregates use
# `@entity(immutable: false)`; append-only event rows use `@entity(immutable: true)`).
#
# Canonical contract: docs/analytics/subgraph-schema-v1.0.0.md
#
# ABI parity: the full ABI-event → manifest-handler → schema-entity chain is
# validated by scripts/check_subgraph_manifest_events_vs_abi.py (CI gate).
# Intentionally unindexed admin events are listed in that script's allowlist.
#
# Notes:
# - This schema intentionally includes a few extra "internal analytics" entities (furnace bonus paid, etc)
#   that are not strictly required by the canonical UI contract.

enum LeaderboardDuration {
  LAST_24H
  LAST_7D
  LAST_30D
  LIFETIME
}

# -----------------------------------------------------------------------------
# Core protocol surfaces (required by docs/analytics/subgraph-schema-v1.0.0.md)
# -----------------------------------------------------------------------------

type Protocol @entity(immutable: false) {
  id: ID! # always "1"
  chainId: Int!
  version: String! # "v1.0.0"
  deployedAtBlock: BigInt!

  # Core addresses (from deployments manifest and canonical wiring events).
  # These fields represent the latest observed current wiring within the indexed event surface.
  # ShareholderRoyalties may be discovered early from ShareholderWiringSet before Baron business activity.
  claimToken: Bytes!
  veClaimNft: Bytes!
  mineCore: Bytes!
  shareholderRoyalties: Bytes!
  furnace: Bytes!
  marketRouter: Bytes!

  # EntryTokenRegistry wiring (discover from EntryTokenRegistrySet events)
  furnaceEntryTokenRegistry: Bytes
  mineCoreEntryTokenRegistry: Bytes

  # Back-compat alias (required). MUST equal furnaceEntryTokenRegistry.
  entryTokenRegistry: Bytes

  # Optional wiring / infra. `dexAdapter` may remain null in the pure event-driven subgraph because
  # current v1.0.0 indexed events do not emit it directly.
  dexAdapter: Bytes
  furnaceQuoter: Bytes
  lpStakingVault: Bytes
  launchController: Bytes
  genesisLpVault24m: Bytes
  maintenanceHub: Bytes

  # Latest known flags (from events)
  takeoversPaused: Boolean!
  lockingPaused: Boolean!
  tradingPaused: Boolean!
}


# -----------------------------------------------------------------------------
# Info surfaces (pricing + APR). Fields may be null early / during degraded mode.
# -----------------------------------------------------------------------------

type TokenPricingSnapshot @entity(immutable: false) {
  id: ID! # always "1"
  updatedAt: BigInt
  claimEthTwap30m: BigDecimal
  ethUsd: BigDecimal
  ethUsdUpdatedAt: BigInt
  totalSupplyWei: BigInt
  # CLAIM principal currently locked inside `VeClaimNFT` (Furnace-locked
  # supply). Used by frontends to derive a circulating-supply market cap:
  #
  #   circulatingSupplyWei = totalSupplyWei - lockedSupplyWei
  #
  # Populator (write site is the same place that refreshes `totalSupplyWei`
  # — e.g. a Furnace event handler, an ERC20 Transfer handler, or a
  # contract-call refresh keyed off `Protocol.claimToken` +
  # `Protocol.veClaimNft`) MUST set both fields together so the
  # subtraction can never go negative.
  lockedSupplyWei: BigInt
}

type AprSnapshot @entity(immutable: false) {
  id: ID! # always "1"
  updatedAt: BigInt
  lpAprBps24h: BigInt
  lpAvgTvl24hUsd: BigDecimal
  veAprBps24h: BigInt
}

# Per-hour aggregation buckets that back the rolling 24h APR window defined in
# docs/spec/apr-calculation-spec-v1.0.0.md. Each bucket stores both flow
# (`lpRewardsClaimWei`, `shareholderEthWei`) and stock
# (`lpTvlUsd`, `totalLockedClaimUsd`) measurements taken on the boundary the
# bucket was touched, so the AprSnapshot refresh can compute the arithmetic
# mean of TVL over the last 24 buckets and the floor-rounded sum of rewards
# over the same window in a single O(24) pass.
type LpAprHourlyBucket @entity(immutable: false) {
  id: ID! # hour start in unix seconds, e.g. "1716240000"
  hourStart: BigInt!

  # Flow buckets (sum within the hour).
  lpRewardsClaimWei: BigInt!
  shareholderEthWei: BigInt!

  # Stock snapshot at the most recent touch within the hour.
  totalStakedLpWei: BigInt
  lpTvlUsd: BigDecimal
  totalLockedClaimUsd: BigDecimal

  # Pricing inputs preserved for replay / debug.
  claimUsd: BigDecimal
  ethUsd: BigDecimal

  updatedAt: BigInt!
}

type User @entity(immutable: false) {
  id: ID! # address lowercase
  address: Bytes!

  # Queries filtering/sorting by takeoverCount, ethSpentOnTakeoversWei,
  # longestReignSeconds, or furnaceEthInWei for leaderboards require full-table scans.
  # The Graph does not currently support @index directives, so this is a known
  # limitation. API consumers should use off-chain indexing (e.g., Postgres
  # materialized views over the subgraph) for leaderboard queries to avoid
  # timeout issues at scale.

  # Display labels (cached; nullable)
  basename: String
  ens: String
  displayName: String

  # Aggregates for official leaderboards (lifetime)
  takeoverCount: Int!
  ethSpentOnTakeoversWei: BigInt!
  kingClaimMinedWei: BigInt!
  longestReignSeconds: Int!

  shareholderEthClaimedWei: BigInt! # includes ETH + LOCK_FURNACE modes
  furnaceEthInWei: BigInt! # sum FurnaceEnter.ethIn
  furnacePrincipalClaimInWei: BigInt! # sum FurnaceEnter.principalClaim

  # Event-driven ve/principal snapshots. `veBalanceWei` is refreshed on lock activity only and does
  # not continuously decay between unrelated events. Consumers that need “ve now” MUST recompute from
  # the full owner lock set (`locks { amountWei, lockEnd, autoMax }`) against the same payload's
  # `_meta.block.timestamp`. Owner-scoped UIs MUST page that lock set; a capped `first: N` owner query
  # is not sufficient.
  veBalanceWei: BigInt
  totalLockedClaimWei: BigInt

  # delegationSessionsAsDelegate) are virtual reverse lookups. They cannot be
  # paginated with `skip` safely on a moving head. Consumers MUST use cursor-based
  # pagination with a pinned _meta block as documented in the schema comments.

  # Convenience reverse links. Consumers still need to paginate this relation at one pinned head
  # when they need the full owner lock set; `user(id: ...) { locks(first: N) }` is just a capped page.
  locks: [VeLock!]! @derivedFrom(field: "owner")

  # Bot sessions (DelegationHub)
  delegationSessionsGranted: [DelegationSession!]! @derivedFrom(field: "user")
  delegationSessionsAsDelegate: [DelegationSession!]! @derivedFrom(field: "delegate")
}

# -----------------------------------------------------------------------------
# DelegationHub (bot sessions)
# -----------------------------------------------------------------------------

enum DelegationActionType {
  UNKNOWN
  TAKEOVER
  REIGN_RECIPIENTS
  CLAIM
  FURNACE_ENTER
  VE_LOCK
  CONFIG
}

# Current session state (approvals-like).
# A session is uniquely identified by (user, delegate).
# Revoke is represented by perms=0, expiry=0.
# Active UI state should therefore be derived as `perms > 0 && expiry >= _meta.block.timestamp`.
#
# For traceability:
# - lastUsedAt / lastActionType / lastTxHash are updated from DelegationSessionUsed events
# - uses[] stores the full history of session uses (tx hashes included)
# - UI/API consumers MUST derive active vs expired from the same payload's `_meta.block.timestamp`, not wall clock
# - active-session lists/counts MUST read the full `delegationSessions` snapshot via paginated `id` cursor reads
#   at one pinned `_meta` head; a capped `first: N` page can hide active delegates and break revoke flows
# - Radar-style delegation/reign-recipient alert polling MUST page forward from a pinned `(blockNumber,id)` cursor or fail closed

type DelegationSession @entity(immutable: false) {
  id: ID! # "{user}-{delegate}"
  user: User!
  delegate: User!

  perms: BigInt!
  expiry: BigInt!

  createdAt: BigInt!
  updatedAt: BigInt!
  revokedAt: BigInt

  lastUsedAt: BigInt
  lastActionType: DelegationActionType
  lastTxHash: Bytes

  uses: [DelegationSessionUse!]! @derivedFrom(field: "session")
}

type DelegationSessionUse @entity(immutable: true) {
  id: ID! # txHash-logIndex
  # Zero-padded blockNumber + ':' + id. REQUIRED for deterministic cursor pagination
  # on consumers that page by blockNumber: ordering by `blockNumber` alone leaves
  # same-block ties non-deterministic and a (lastBlock,lastId) cursor can skip rows.
  # Always paginate with `orderBy: sortKey, sortKey_gt: $afterSortKey` (see
  # `frontend/src/lib/delegationSessions.ts` for the reference consumer).
  sortKey: String!
  session: DelegationSession!
  user: User!
  delegate: User!

  actionType: DelegationActionType!
  actionTypeId: Int!
  permsUsed: BigInt!
  refId: BigInt!

  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!

  # Contract that emitted DelegationSessionUsed (MineCore / Furnace / ClaimAllHelper, etc).
  emitter: Bytes!
}

type DelegationSessionSetEvent @entity(immutable: true) {
  id: ID! # txHash-logIndex
  # See DelegationSessionUse.sortKey for the rationale and required usage pattern.
  sortKey: String!
  session: DelegationSession!
  user: User!
  delegate: User!

  perms: BigInt!
  expiry: BigInt!
  isRevocation: Boolean!

  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}


type Reign @entity(immutable: false) {
  id: ID! # reignId as string
  reignId: BigInt!
  king: User!
  # Current takeover price / decay is derived downstream from `startedByTakeover.referencePriceWei`
  # and this `startTime`. Consumers MUST use the same query payload's `_meta.block.timestamp`
  # as “now”; wall-clock-only decay can drift ahead of the indexed head.
  startTime: BigInt!
  endTime: BigInt # null if ongoing
  totalClaimMinedWei: BigInt # set at finalization only
  totalEthToKingWei: BigInt # set at finalization only

  startedByTakeover: Takeover!
  finalizedBy: ReignFinalizedEvent

  previousReign: Reign
}

type Takeover @entity(immutable: true) {
  id: ID! # txHash-logIndex
  # Zero-padded blockNumber + ':' + id. See DelegationSessionUse.sortKey.
  # Leaderboard ingest (`workers/chat/src/lib/leaderboards/sync/fetchers/takeovers.ts`)
  # MUST page by `orderBy: sortKey, sortKey_gt: $afterSortKey`.
  sortKey: String!
  reign: Reign!
  previousKing: User
  newKing: User!
  pricePaidWei: BigInt!
  referencePriceWei: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

type ReignFinalizedEvent @entity(immutable: true) {
  id: ID! # txHash-logIndex
  # Zero-padded blockNumber + ':' + id. See DelegationSessionUse.sortKey.
  sortKey: String!
  reign: Reign!
  king: User!
  startTime: BigInt!
  endTime: BigInt!
  totalClaimMinedWei: BigInt!
  totalEthToKingWei: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

