name: Solidity policy lint

concurrency:
  group: solidity-policy-lint-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/solidity_policy_lint.sh'
      - 'Makefile'
      - '.github/workflows/solidity-policy-lint.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/solidity_policy_lint.sh'
      - 'Makefile'
      - '.github/workflows/solidity-policy-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Solidity policy lint
        run: make solidity-policy-lint
