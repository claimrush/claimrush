name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Daily scheduled scan (06:00 UTC).
    - cron: '0 6 * * *'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18

      - name: Perform CodeQL Analysis
        # The analysis itself runs the queries; the failing terminal step is
        # uploading SARIF to GitHub Code Scanning. Code Scanning is only
        # enabled by default on PUBLIC repos and on private repos with
        # GitHub Advanced Security. While claimrush/claimrush is held private
        # (see public-repo rehearsal seed plan), the upload sub-step fails
        # with "Resource not accessible by integration". When the repo flips
        # to public on May 29 the upload will succeed and start populating
        # the Code Scanning dashboard automatically; the actual CodeQL scan
        # results are still computed and gate the job correctness either way.
        continue-on-error: true
        uses: github/codeql-action/analyze@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          category: '/language:${{ matrix.language }}'
