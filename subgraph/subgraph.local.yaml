specVersion: 0.0.5
schema:
  file: ./schema.graphql

# Local dev manifest
#
# - This is intended for a local graph-node indexing a local chain (Anvil/Hardhat).
# - Network name must match your graph-node config (suggested: "local").
# - Addresses and start blocks mirror deployments/local.json.
# - sync_subgraph_manifest_from_deployments.py supports --allow-start-block-zero
#   when a local manifest is intentionally unset before deployment.

dataSources:
  # -----------------
  # MineCore
  # -----------------
  - kind: ethereum
    name: MineCore
    network: local
    source:
      address: "0x610178da211fef7d417bc0e6fed39f05609ad788"
      abi: MineCore
      startBlock: 3
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Protocol
        - TokenPricingSnapshot
        - AprSnapshot
        - User
        - DelegationSession
        - DelegationSessionUse
        - Reign
        - Takeover
        - ReignFinalizedEvent
        - ActivityItem
        - KingWithdrawalEvent
        - KingWithdrawalToEvent
        - RefundCreditedEvent
        - RefundWithdrawnEvent
        - ShareholderRoyaltiesTakeoverFailedEvent
        - ShareholderRoyaltiesFlushFailedEvent
        - EntryTokenRegistry
        - ReignRecipientsState
        - ReignRecipientsSetEvent

      abis:
        - name: MineCore
          file: ../abis/base_sepolia/MineCore.abi.json
        - name: EntryTokenRegistry
          file: ../abis/base_sepolia/EntryTokenRegistry.abi.json
      eventHandlers:
        - event: EntryTokenRegistrySet(indexed address)
          handler: handleEntryTokenRegistrySet
        - event: FurnaceChanged(indexed address,indexed address)
          handler: handleFurnaceChanged
        - event: Takeover(indexed uint256,indexed address,indexed address,uint256,uint256,uint256)
          handler: handleTakeover
        - event: ReignFinalized(indexed uint256,indexed address,uint256,uint256,uint256,uint256)
          handler: handleReignFinalized
        - event: TakeoversPausedChanged(bool)
          handler: handleTakeoversPausedChanged
        - event: KingWithdrawal(indexed address,uint256)
          handler: handleKingWithdrawal
        - event: KingWithdrawalTo(indexed address,indexed address,uint256)
          handler: handleKingWithdrawalTo
        - event: RefundCredited(indexed address,uint256)
          handler: handleRefundCredited
        - event: RefundWithdrawn(indexed address,indexed address,uint256)
          handler: handleRefundWithdrawn
        - event: ShareholderRoyaltiesTakeoverFailed(indexed uint256,uint256,bytes)
          handler: handleShareholderRoyaltiesTakeoverFailed
        - event: ShareholderRoyaltiesFlushFailed(bytes)
          handler: handleShareholderRoyaltiesFlushFailed
        - event: KingAutoLockConfigured(indexed address,bool,uint256,uint256,uint256,bool,uint256)
          handler: handleKingAutoLockConfigured
        - event: KingAutoLockExecuted(indexed uint256,indexed address,uint256,uint256)
          handler: handleKingAutoLockExecuted
        - event: KingAutoLockSkipped(indexed uint256,indexed address,uint256,uint8)
          handler: handleKingAutoLockSkipped
        - event: KingAutoLockFailed(indexed uint256,indexed address,uint256,bytes)
          handler: handleKingAutoLockFailed
        - event: ReignRecipientsSet(indexed uint256,indexed address,indexed address,address)
          handler: handleReignRecipientsSet
          receipt: true
        - event: DelegationSessionUsed(indexed address,indexed address,indexed uint8,uint256,uint256,uint256)
          handler: handleDelegationSessionUsed
        - event: KingEthPaid(indexed address,uint256)
          handler: handleKingEthPaid
        - event: KingEthCredited(indexed address,uint256)
          handler: handleKingEthCredited
      file: ./src/mappings/minecore.ts

  # -----------------
  # DelegationHub (bot sessions)
  # -----------------
  - kind: ethereum
    name: DelegationHub
    network: local
    source:
      address: "0x0dcd1bf9a1b36ce34237eeafef220932846bcd82"
      abi: DelegationHub
      startBlock: 3
    mapping:
