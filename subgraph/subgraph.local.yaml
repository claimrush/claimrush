        - VeLock
        - ReserveCreditedEvent
        - LpRewardsVaultSetEvent
        - LpStreamFundedEvent
        - FurnaceQuoterSetEvent
        - LpRewardsNotifyFailedEvent
        - ReserveClampedEvent
        - FurnaceBonusSnapshot
        - FurnaceBonusSample
        - ActivityItem
        - DailyFurnaceAgg
        - FurnaceState
        - LpRewardsSample
        - EntryTokenRegistry
        - DelegationSession
        - DelegationSessionUse
      abis:
        - name: Furnace
          file: ../abis/base_sepolia/Furnace.abi.json
        - name: EntryTokenRegistry
          file: ../abis/base_sepolia/EntryTokenRegistry.abi.json
        - name: FurnaceQuoter
          file: ../abis/base_sepolia/FurnaceQuoter.abi.json
      eventHandlers:
        - event: EntryTokenRegistrySet(indexed address)
          handler: handleEntryTokenRegistrySet
        - event: MineCoreChanged(indexed address,indexed address)
          handler: handleMineCoreChanged
        - event: MineMarketChanged(indexed address,indexed address)
          handler: handleMineMarketChanged
        - event: ShareholderRoyaltiesChanged(indexed address,indexed address)
          handler: handleShareholderRoyaltiesChanged
        - event: LpRewardsVaultSet(indexed address,indexed address)
          handler: handleLpRewardsVaultSet
        - event: LpStreamFunded(uint256,uint256,uint256)
          handler: handleLpStreamFunded
        - event: FurnaceQuoterSet(indexed address,indexed address)
          handler: handleFurnaceQuoterSet
        - event: LpRewardsNotifyFailed(indexed address,uint256,bytes)
          handler: handleLpRewardsNotifyFailed
        - event: ReserveClamped(indexed address,uint256,uint256,uint256,uint256)
          handler: handleReserveClamped
        - event: BonusPaid(indexed address,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleBonusPaid
        - event: LpOverflowDripPaid(uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleLpOverflowDripPaid
        - event: FurnaceEnter(indexed address,uint8,uint256,uint256,uint256,uint256)
          handler: handleFurnaceEnter
          receipt: true
        - event: FurnaceMergeWithBonus(indexed address,indexed uint256,indexed uint256,uint256,uint256,uint256,uint256,bool,uint256,uint256)
          handler: handleFurnaceMergeWithBonus
        - event: LockSoldToFurnace(indexed address,indexed uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleLockSoldToFurnace
        - event: ReserveCredited(uint256,uint256)
