name: Semgrep security scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "semgrep==1.152.0"

      - name: Run Semgrep (custom rules)
        run: |
          semgrep scan \
            --config .semgrep.yml \
            --error \
            --verbose \
            --metrics=off \
            --sarif --sarif-output semgrep-custom.sarif \
            --exclude "node_modules" \
            --exclude "lib" \
            --exclude "out" \
            --exclude "dist" \
            --exclude "build" \
            --exclude ".next" \
            --exclude "generated" \
            src/ script/ keeper/ agents/ packages/node-utils/ scripts/ analytics/scripts/ subgraph/src/ test/

      - name: Run Semgrep (OWASP + Node.js + TypeScript + Python registry rules)
        # NOTE: p/solidity was retired upstream (semgrep.dev returns HTTP 404
        # for /c/p/solidity). The remaining community Solidity packs are
        # stylistic and produce thousands of false positives on protocol
        # code. Solidity is covered by `make slither`, `make aderyn`, and
        # the project-owned rules in `.semgrep.yml` (run from the previous
        # step). Keep this in sync with .github/workflows/public/ci.yml.
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/nodejs \
            --config=p/typescript \
            --config=p/python \
            --error \
            --verbose \
            --metrics=off \
            --sarif --sarif-output semgrep-registry.sarif \
            --exclude "node_modules" \
            --exclude "lib" \
            --exclude "out" \
            --exclude "dist" \
            --exclude "build" \
            --exclude ".next" \
            --exclude "generated" \
            src/ script/ keeper/ agents/ packages/node-utils/ scripts/ analytics/scripts/ subgraph/src/ test/

      - name: Upload Semgrep SARIF (custom)
        if: always()
        # See .github/workflows/semgrep.yml for rationale — tolerate org-level
        # Actions storage-quota exhaustion so a quota-saturated org doesn't
        # red-X every push. Code Scanning SARIF upload below is a separate API.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-custom-report
          path: semgrep-custom.sarif
          retention-days: 30

      - name: Upload Semgrep SARIF (registry)
        if: always()
        # See "Upload Semgrep SARIF (custom)" above for rationale.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-registry-report
          path: semgrep-registry.sarif
          retention-days: 30

      - name: Upload Semgrep custom SARIF to GitHub Security tab
        if: always() && hashFiles('semgrep-custom.sarif') != ''
        # GitHub Code Scanning (the SARIF dashboard at /security/code-scanning)
        # is only enabled by default on PUBLIC repos and on private repos with
        # GitHub Advanced Security. While claimrush/claimrush is held private
        # (see public-repo rehearsal seed plan), the upload step fails with
        # "Resource not accessible by integration". The actual semgrep scan
        # earlier in the job is the gate; the upload is publication-only.
        # When the repo flips to public on May 29 the upload will succeed
        # and start populating the Code Scanning dashboard automatically.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          sarif_file: semgrep-custom.sarif
          category: semgrep-custom

      - name: Upload Semgrep registry SARIF to GitHub Security tab
        if: always() && hashFiles('semgrep-registry.sarif') != ''
        # See "Upload Semgrep custom SARIF to GitHub Security tab" above for rationale.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          sarif_file: semgrep-registry.sarif
          category: semgrep-registry
